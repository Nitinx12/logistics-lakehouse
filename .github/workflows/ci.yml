# Verifies every pull request with the repo's own checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m compileall -q src scripts airflow tests
      - run: uv run pytest tests/unit -q
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lakehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lakehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: lakehouse
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: lakehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Apply migrations in version order
        run: uv run scripts/run_migrate.py
      - name: Assert layer schemas exist
        run: |
          test "$(psql -tAc "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name IN ('bronze', 'silver', 'gold', 'ops', 'dq', 'analytics')")" = 6
          test "$(psql -tAc "SELECT COUNT(*) FROM ops.schema_migrations")" = "$(ls sql/scripts/*.sql | wc -l)"
