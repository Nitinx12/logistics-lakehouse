[project]
name = "lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "databricks-sdk>=0.146.0",
    "databricks-sql-connector>=4.6.0",
    "delta-spark==3.2.1",
    "great-expectations>=1.23.2",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.2",
    "pyspark==3.5.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "sqlfluff>=4.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff.lint]
ignore = ["E402"]
