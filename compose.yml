# compose.yml — lakehouse local stack (ARCHITECTURE.md §15)
#
#   make up                  core profile: warehouse + airflow + spark runner
#   PROFILE=stream make up    + kafka KRaft + redis cache
#   docker compose --profile all up -d   everything defined here
#
# Settings come from .env (gitignored, see .env.example). Compose fails fast
# on missing secrets via ${VAR:?msg}. Only dev-facing ports are published;
# postgres/kafka/redis stay inside the docker network (ARCHITECTURE.md §14),
# except where local uv runs need host access (marked below).

x-common-env: &common-env
  env_file:
    - path: .env
      required: true

x-airflow-build: &airflow-build
  context: .
  dockerfile: airflow/Dockerfile.airflow

services:
  # ------------------------------------------------------------------
  # core profile
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: [core]
    mem_limit: 512m
    <<: *common-env
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-lakehouse}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-metadata:
    image: postgres:16-alpine
    profiles: [core]
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD missing in .env}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    profiles: [core]
    mem_limit: 64m
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      LISTEN_PORT: ${PGBOUNCER_PORT}
    ports:
      # published so local `uv run` code reaches the warehouse via POSTGRES_HOST=localhost
      - "${PGBOUNCER_PORT:-6432}:${PGBOUNCER_PORT:-6432}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-broker:
    image: redis:7-alpine
    profiles: [core]
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_BROKER_PASSWORD:?REDIS_BROKER_PASSWORD missing in .env}", "--appendonly", "yes"]
    volumes:
      - redis-broker:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli -a \"${REDIS_BROKER_PASSWORD:?REDIS_BROKER_PASSWORD missing in .env}\" ping 2>/dev/null)\" = PONG"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    image: lakehouse-airflow:2.11.2
    build: *airflow-build
    profiles: [core]
    mem_limit: 256m
    <<: *common-env
    depends_on:
      airflow-metadata:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users list | grep -q "$${_AIRFLOW_WWW_USER_USERNAME:-admin}" || airflow users create \
          --role Admin \
          --username "$${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD:?www user password missing in .env}" \
          --email "$${AIRFLOW__SMTP__SMTP_MAIL_FROM}" \
          --firstname lakehouse --lastname admin
        airflow pools set spark_extract 2 "Partitioned Spark extracts, one at a time per host"
        airflow pools set pg_transform 2 "Set based warehouse transforms"
        airflow pools set dq 2 "Quality gates"

  airflow-webserver:
    image: lakehouse-airflow:2.11.2
    build: *airflow-build
    profiles: [core]
    mem_limit: 512m
    <<: *common-env
    environment:
      LAKEHOUSE_REPO: /app
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      PYTHONPATH: /app
    volumes:
      - ./airflow:/app/airflow:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  airflow-scheduler:
    image: lakehouse-airflow:2.11.2
    build: *airflow-build
    profiles: [core]
    # Raised from the 512m budget: LocalExecutor runs Spark extracts inside
    # this container, and 512m OOM-killed it mid run on 2026-10-07.
    mem_limit: 2g
    <<: *common-env
    environment:
      LAKEHOUSE_REPO: /app
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MongoDB_URI: mongodb://host.docker.internal:27017/fleet_operations
      # Scheduler shares this 2g container with the Spark driver (LocalExecutor),
      # so bound Spark below the host sized .env values (ARCHITECTURE.md §15.2).
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1g
      SPARK_EXECUTOR_MEMORY: 1g
      SPARK_SQL_SHUFFLE_PARTITIONS: 8
      SPARK_NETWORK_TIMEOUT: 300s
      SPARK_EXECUTOR_HEARTBEAT: 30s
    volumes:
      - ./airflow:/app/airflow:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 60s
      retries: 3
    restart: unless-stopped
    # NOTE: .env runs LocalExecutor, so no celery worker yet.
    # Add airflow-worker (command: celery worker) when switching to CeleryExecutor.

  spark-runner:
    image: apache/spark:4.2.0
    profiles: [core]
    mem_limit: 512m
    entrypoint: ["sleep", "infinity"]
    <<: *common-env
    working_dir: /app
    volumes:
      - .:/app
    # one-off extracts: docker compose run --rm spark-runner python extract/...
    healthcheck:
      test: ["CMD-SHELL", "test -d /opt/spark"]
      interval: 60s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------
  # stream profile (ARCHITECTURE.md §8; additive, batch never needs it)
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.0
    profiles: [stream]
    mem_limit: 1g
    hostname: kafka
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID missing in .env}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      # published so the local replay producer reaches kafka from the host
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      retries: 5
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    profiles: [stream]
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD missing in .env}"]
    ports:
      # published so the local redis sink reaches the cache from the host
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli -a \"${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD missing in .env}\" ping 2>/dev/null)\" = PONG"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------------
  # obs profile (ARCHITECTURE.md §13; trimmed M7: metrics, dashboards, mail)
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [obs]
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [obs]
    mem_limit: 128m
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_DQ_USER}:${PG_DQ_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries/queries.yml
    volumes:
      - ./monitoring/postgres-exporter:/queries:ro
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9187/metrics"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [obs]
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD missing in .env}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER:?AIRFLOW__SMTP__SMTP_USER missing in .env}
      GF_SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD:?AIRFLOW__SMTP__SMTP_PASSWORD missing in .env}
      GF_SMTP_FROM_ADDRESS: ${AIRFLOW__SMTP__SMTP_MAIL_FROM:?AIRFLOW__SMTP__SMTP_MAIL_FROM missing in .env}
      ALERT_RECEIVER: ${ALERTMANAGER_RECEIVER_EMAIL:?ALERTMANAGER_RECEIVER_EMAIL missing in .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [obs]
    mem_limit: 64m
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:?ALERTMANAGER_SMTP_FROM missing in .env}
      ALERTMANAGER_SMTP_AUTH_USERNAME: ${ALERTMANAGER_SMTP_AUTH_USERNAME:?ALERTMANAGER_SMTP_AUTH_USERNAME missing in .env}
      ALERTMANAGER_SMTP_AUTH_PASSWORD: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:?ALERTMANAGER_SMTP_AUTH_PASSWORD missing in .env}
      ALERTMANAGER_RECEIVER_EMAIL: ${ALERTMANAGER_RECEIVER_EMAIL:?ALERTMANAGER_RECEIVER_EMAIL missing in .env}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------
  # serve profile lands in M6 (needs the streamlit app first).
  # ------------------------------------------------------------------

volumes:
  pgdata:
  airflow-metadata:
  redis-broker:
  redis-cache:
  kafka-data:
  promdata:
  grafana-data:
