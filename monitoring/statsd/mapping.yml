# statsd_exporter mappings for Airflow task metrics (ARCHITECTURE.md §13.1).
# Consumed when the statsd exporter joins the obs profile.
mappings:
  - match: airflow.dag.*.*.duration
    match_type: regex
    name: airflow_task_duration_seconds
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.dag.*.*.success
    match_type: regex
    name: airflow_task_success_total
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.dag.*.*.failed
    match_type: regex
    name: airflow_task_failed_total
    labels:
      dag_id: $1
      task_id: $2
  - match: airflow.dag_processing.processor_timeouts
    name: airflow_dag_processor_timeouts_total
  - match: airflow.scheduler.tasks.running
    name: airflow_scheduler_tasks_running
  - match: airflow.scheduler.tasks.starving
    name: airflow_scheduler_tasks_starving
