# Prometheus scrape config for the lakehouse obs profile (ARCHITECTURE.md §13.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
